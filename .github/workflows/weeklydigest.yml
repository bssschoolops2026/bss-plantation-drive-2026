name: Weekly Plantation Drive Digest

on:
  # No GitHub-native `schedule:` trigger here on purpose — GitHub's own cron scheduler
  # was consistently delaying this workflow by 7.5-9 hours every week (confirmed from
  # run history), regardless of the configured time. Timing is instead driven precisely
  # by a Claude Code Remote Routine that calls workflow_dispatch every Monday at 9:30 AM
  # Pakistan time (04:30 UTC), sidestepping GitHub's scheduler queue entirely.
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Send digest email
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ vars.DIGEST_RECIPIENTS }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node sendweeklydigest.mjs
